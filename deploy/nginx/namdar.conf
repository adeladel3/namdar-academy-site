# Namdar Academy — Nginx reverse proxy config
#
# Place this file at /etc/nginx/sites-available/namdar.conf and symlink it
# into /etc/nginx/sites-enabled/.
#
# IMPORTANT — SEP gateway requires the production callback to be reachable
# at the exact URL registered with SEP, which is `http://namdaracademy.com`
# (HTTP, not HTTPS, per SEP's current registration). The block below keeps
# port 80 open and serves /api/payment/callback alongside the HTTPS site.
# All other traffic is redirected to HTTPS for security. If SEP ever updates
# the registered URL to https://namdaracademy.com, drop the bare-http server
# block and switch to a 301 redirect on port 80.

# Rate-limit zone for login/OTP/admin endpoints. 5 req/s per IP, burst handled
# at the location level.
limit_req_zone $binary_remote_addr zone=namdar_api:10m rate=5r/s;

# ── HTTP — keeps the SEP callback path reachable on port 80 ────────────────
server {
    listen 80;
    listen [::]:80;
    server_name namdaracademy.com www.namdaracademy.com;

    # Required for SEP RedirectUrl. SEP rejects callbacks that don't match the
    # registered domain *and protocol* exactly.
    location = /api/payment/callback {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ACME challenge (Let's Encrypt renewals).
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    # Everything else → HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS — main site ──────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name namdaracademy.com www.namdaracademy.com;

    # Replace with the actual cert paths emitted by certbot.
    ssl_certificate     /etc/letsencrypt/live/namdaracademy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/namdaracademy.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # ── Security headers ──
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ── Compression ──
    # The hero JPEGs/PNGs are already binary-compressed and don't benefit from
    # gzip, but the Next.js SSR HTML payload (which embeds the React Server
    # Component flight tree) and the per-page JS chunks routinely compress
    # 75-85% smaller. On a 3G/Edge connection (common in Iran outside metros)
    # this is the difference between a 6-second and a 1.5-second First Paint.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xml+rss
        application/wasm
        image/svg+xml
        font/ttf
        font/otf
        font/woff
        font/woff2;
    # Brotli is loaded only if the nginx-module-brotli package is installed
    # (apt install libnginx-mod-http-brotli-static libnginx-mod-http-brotli-filter).
    # Comment these two lines out if your nginx build doesn't include brotli;
    # gzip alone is already a major win.
    # brotli on;
    # brotli_comp_level 5;
    # brotli_types
    #     text/plain
    #     text/css
    #     application/javascript
    #     application/json
    #     image/svg+xml
    #     font/woff2;

    # ── Body limits ──
    # Default cap for ordinary requests (forms, JSON, OTP, payment, etc.).
    client_max_body_size 25M;

    # Admin media uploads need a much larger ceiling than JSON forms because
    # the admin pushes course-cover photos and intro videos. The Next app
    # itself caps at 200 MB (src/app/api/admin/media/upload/route.ts), so
    # mirror that here. Keep this OUTSIDE the generic /api/admin/ block so
    # ordinary admin JSON requests still get the small 25M cap.
    location = /api/admin/media/upload {
        limit_req zone=namdar_api burst=5 nodelay;
        client_max_body_size 200M;
        # Stream the upload straight to the upstream instead of buffering the
        # whole 200 MB body to /var/lib/nginx first. Cuts the upload-to-disk
        # latency in half on large videos.
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Build-output bundles: Next emits hashed filenames under /_next/static, so
    # they can be cached forever. Without `immutable` browsers re-validate every
    # page-load and pay a full round-trip on slow networks even for cached
    # files. With it, after the first visit subsequent navigations are
    # near-instant from the disk cache.
    location ^~ /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Override Next's default Cache-Control just in case it ever changes.
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # Figma exports + admin-uploaded media + static fonts. These filenames are
    # not content-hashed, so we use a 30-day max-age (instead of `immutable`)
    # so re-uploads still propagate within a month. Browsers also
    # use If-Modified-Since against the file mtime so an updated file shows
    # up on the next hit anyway.
    location ~* ^/(figma|uploads|fonts)/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
    }

    # Rate-limited admin/auth endpoints.
    location ~ ^/api/(auth|admin|tickets|callback-requests|contact)/ {
        limit_req zone=namdar_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
